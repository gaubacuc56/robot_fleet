upstream backend_pool {
    # One upstream server per address Compose's DNS returns for "backend" —
    # expanded once, at config load. Scaling replicas up later therefore needs
    # `docker compose restart nginx`.
    server backend:8080;

    # Long-lived WebSockets: round-robin would keep handing new sockets to an
    # already busy replica.
    least_conn;

    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    # Telemetry is small and frequent; buffering only adds latency.
    proxy_buffering off;

    # No sticky sessions on purpose: updates travel over Redis, so a robot on
    # replica A still reaches a dashboard client on replica B.
    location ~ ^/(robots|dashboard)$ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Generous, or nginx cuts sockets that are merely idle.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
