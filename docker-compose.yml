name: robot-fleet

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongodb:27017/robot-fleet
      REDIS_URL: redis://redis:6379
      WORKERS: ${WORKERS:-2}
      OFFLINE_TIMEOUT_MS: ${OFFLINE_TIMEOUT_MS:-10000}
      LOW_BATTERY_THRESHOLD: ${LOW_BATTERY_THRESHOLD:-20}
      CRITICAL_BATTERY_MINUTES: ${CRITICAL_BATTERY_MINUTES:-5}
      HISTORY_BUCKET_SECONDS: ${HISTORY_BUCKET_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_WEBSOCKET_URL: ${PUBLIC_WEBSOCKET_URL:-ws://localhost:8080}
        BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  simulator:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["node", "tools/simulator/robot.simulator.js"]
    environment:
      SERVER_URL: ws://backend:8080
      ROBOT_COUNT: ${ROBOT_COUNT:-5}
      DRAIN_ROBOT_ID: ${DRAIN_ROBOT_ID:-00001}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
